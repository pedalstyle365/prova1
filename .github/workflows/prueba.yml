name: Publicar ofertas Telegram

on:
  schedule:
    - cron: '0 10 * * *'
      timezone: "Europe/Madrid"
    - cron: '0 20 * * *'
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar publicación ignorando el slot"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-ofertas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force == true && '1' || '0' }}
        run: python main.py

      - name: Guardar estado
        if: always()
        run: |
          if [ -f published.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add published.json
            git commit -m "chore: actualizar estado de publicaciones" || echo "Sin cambios"
            git push || echo "Nada que empujar"
          fi
